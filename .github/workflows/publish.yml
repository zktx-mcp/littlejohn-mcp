name: Publish npm package and MCP Registry entry

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      integrity: ${{ steps.publish.outputs.integrity }}
    steps:
      - name: Checkout release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0

      - name: Set publication paths
        run: |
          printf 'LITTLEJOHN_RELEASE_OUTPUT=%s/littlejohn-release/littlejohn-mcp.tgz\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: npm ci

      - name: Build and verify the publication artifact
        run: npm run release:check

      - name: Setup publication Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org

      - name: Install fixed MCP publisher
        if: ${{ !github.event.release.prerelease }}
        uses: ./.github/actions/setup-mcp-publisher

      - name: Publish the verified npm package
        id: publish
        env:
          GITHUB_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          GITHUB_RELEASE_TAG: ${{ github.event.release.tag_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release:publish:npm

  publish-mcp-registry:
    name: Register on MCP Registry
    needs: publish-npm
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0

      - name: Install fixed MCP publisher
        uses: ./.github/actions/setup-mcp-publisher

      - name: Confirm npm publication and register on MCP Registry
        env:
          GITHUB_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          GITHUB_RELEASE_TAG: ${{ github.event.release.tag_name }}
          NPM_RELEASE_INTEGRITY: ${{ needs.publish-npm.outputs.integrity }}
        run: npm run release:publish:mcp
